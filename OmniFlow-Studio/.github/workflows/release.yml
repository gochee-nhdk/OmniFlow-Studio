name: Release OmniFlow Studio
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: OmniFlow-Studio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.8.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'OmniFlow-Studio/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all workspaces (apps/web and packages)
        run: pnpm run build
      - name: Run complete test suite (unit, E2E, stress, diagnostics)
        run: pnpm run test:all
      - name: Remove artifacts from prior local builds
        run: if (Test-Path release) { Remove-Item release/* -Recurse -Force }
      - name: Build Electron Installer and Portable ZIP
        run: pnpm --filter @fm/local-agent build:installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OmniFlow-Studio/release/*.exe
            OmniFlow-Studio/release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
